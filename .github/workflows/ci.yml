name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements-api.txt
      - name: Installer les dépendances
        run: pip install -r docker/requirements-api.txt pytest httpx
      - name: Lancer les tests
        run: pytest -v

  build-and-push:
    name: Construire et publier l'image ${{ matrix.service }}
    needs: tests                       # uniquement si les tests passent
    if: github.event_name == 'push'    # pas de publication sur une simple proposition de modification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/market-pulse-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/market-pulse-${{ matrix.service }}:${{ github.sha }}
